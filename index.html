<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>워드마스터 EBS 파이널 1200 · 단어 시험</title>
<style>
  :root{
    --bg:#f5f7f4;
    --card:#ffffff;
    --ink:#1f2a24;
    --sub:#68766e;
    --brand:#2f8f5b;
    --brand-dark:#226e46;
    --good:#1fae6b;
    --good-bg:#e8faf1;
    --bad:#e8455c;
    --bad-bg:#fdecee;
    --line:#e3e9e5;
    --tab-inactive:#98a69e;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);min-height:100vh;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    color:var(--ink);
    padding:20px 12px;
  }
  #vocab-app{
    max-width:480px;margin:0 auto;min-height:600px;
    display:flex;flex-direction:column;
  }
  .va-header{padding:18px 20px 0 20px;}
  .va-title{font-size:19px;font-weight:800;margin:0 0 14px 0;}
  .va-tabs{display:flex;gap:6px;background:#e7ebe8;padding:4px;border-radius:12px;}
  .va-tab{
    flex:1;text-align:center;padding:10px 6px;border-radius:9px;
    font-weight:700;font-size:13.5px;color:var(--tab-inactive);cursor:pointer;
    user-select:none;display:flex;align-items:center;justify-content:center;gap:5px;
    transition:all .15s ease;
  }
  .va-tab.active{background:var(--card);color:var(--brand);box-shadow:0 1px 4px rgba(0,0,0,0.08);}
  .va-badge{background:var(--bad);color:#fff;font-size:11px;font-weight:800;padding:1px 7px;border-radius:999px;min-width:18px;}
  .va-body{flex:1;padding:18px 20px 24px 20px;overflow-y:auto;}

  .va-start{background:var(--card);border-radius:16px;padding:24px 20px;text-align:center;margin-top:10px;}
  .va-start h2{font-size:17px;margin:0 0 6px 0;}
  .va-start p{color:var(--sub);font-size:13px;margin:0 0 16px 0;line-height:1.5;}
  .va-label{font-size:12px;font-weight:800;color:var(--sub);margin-bottom:8px;text-align:left;}
  .va-count-row{display:flex;gap:8px;justify-content:center;margin-bottom:16px;flex-wrap:wrap;}
  .va-count-btn{
    padding:8px 13px;border-radius:10px;border:1.5px solid var(--line);background:#fff;
    font-size:13px;font-weight:700;color:var(--sub);cursor:pointer;
  }
  .va-count-btn.sel{border-color:var(--brand);color:var(--brand);background:#eaf5ef;}
  .va-select{
    width:100%;padding:12px 14px;border-radius:11px;border:1.5px solid var(--line);
    background:#fff;font-size:14.5px;font-family:inherit;color:var(--ink);
    margin-bottom:16px;outline:none;
  }
  .va-select:focus{border-color:var(--brand);}
  .va-primary-btn{
    background:var(--brand);color:#fff;border:none;padding:14px 20px;border-radius:12px;
    font-size:15px;font-weight:800;width:100%;cursor:pointer;
  }
  .va-primary-btn:active{background:var(--brand-dark);}

  .va-progress-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--sub);font-weight:700;margin-bottom:8px;}
  .va-progress-bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:20px;}
  .va-progress-fill{height:100%;background:var(--brand);border-radius:99px;transition:width .25s ease;}
  .va-qcard{background:var(--card);border-radius:16px;padding:26px 20px;text-align:center;margin-bottom:18px;}
  .va-qtype{font-size:11px;font-weight:800;color:var(--brand);background:#eaf5ef;display:inline-block;padding:3px 10px;border-radius:999px;margin-bottom:14px;}
  .va-qword{font-size:21px;font-weight:800;line-height:1.45;word-break:keep-all;}
  .va-choices{display:flex;flex-direction:column;gap:10px;}
  .va-choice{
    background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;
    font-size:14.5px;font-weight:600;text-align:left;cursor:pointer;line-height:1.4;word-break:keep-all;
  }
  .va-choice:active{background:#f1f4f2;}
  .va-choice.correct{background:var(--good-bg);border-color:var(--good);color:var(--good);}
  .va-choice.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad);}
  .va-choice.disabled{pointer-events:none;}
  .va-next-wrap{margin-top:16px;}
  .va-feedback{text-align:center;font-size:13px;font-weight:700;margin-top:10px;min-height:18px;word-break:keep-all;line-height:1.4;}
  .va-feedback.ok{color:var(--good);}
  .va-feedback.no{color:var(--bad);}

  .va-result{background:var(--card);border-radius:16px;padding:30px 20px;text-align:center;}
  .va-result h2{font-size:18px;margin:0 0 4px 0;}
  .va-score{font-size:38px;font-weight:900;color:var(--brand);margin:14px 0 4px 0;}
  .va-score-sub{color:var(--sub);font-size:13px;margin-bottom:22px;line-height:1.5;}

  .va-search-input{
    width:100%;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);
    background:var(--card);font-size:15px;font-family:inherit;outline:none;
  }
  .va-search-input:focus{border-color:var(--brand);}

  .va-wb-empty{text-align:center;color:var(--sub);font-size:14px;padding:56px 20px;line-height:1.6;}
  .va-wb-item{
    background:var(--card);border-radius:14px;padding:14px 16px;display:flex;
    justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;
  }
  .va-wb-en{font-weight:800;font-size:15px;margin-bottom:3px;}
  .va-wb-ko{font-size:12.5px;color:var(--sub);line-height:1.45;}
  .va-wb-day{font-size:11px;color:#a8b3ac;margin-top:3px;}
  .va-wb-btn{
    flex-shrink:0;background:#eaf5ef;color:var(--brand);border:none;padding:9px 12px;
    border-radius:9px;font-size:12.5px;font-weight:800;cursor:pointer;white-space:nowrap;
  }
  .va-wb-btn:active{background:#d8ece1;}
  .va-note{text-align:center;font-size:11px;color:#b0bab4;margin-top:16px;}
</style>
</head>
<body>

<div id="vocab-app">
  <div class="va-header">
    <p class="va-title">📗 워드마스터 EBS 파이널 1200</p>
    <div class="va-tabs">
      <div class="va-tab active" id="tab-quiz" onclick="VA.switchTab('quiz')">시험지</div>
      <div class="va-tab" id="tab-search" onclick="VA.switchTab('search')">단어 찾기</div>
      <div class="va-tab" id="tab-wb" onclick="VA.switchTab('wb')">
        내 단어장 <span class="va-badge" id="wb-badge" style="display:none;">0</span>
      </div>
    </div>
  </div>
  <div class="va-body" id="va-body"></div>
</div>

,"ko":"풍부하다, 많이 있다","day":"29-30"},{"en":"shrink","ko":"줄어들다, 축소되다, 움츠리다","day":"29-30"},{"en":"intercept","ko":"가로막다, 가로채다","day":"29-30"},{"en":"harness","ko":"(견인줄을) 매다; 활용하다","day":"29-30"},{"en":"infringe","ko":"침해하다, 위반하다","day":"29-30"},{"en":"committed to","ko":"~에 전념하는, ~에 헌신하는","day":"29-30"},{"en":"misspell","ko":"철자를 잘못 쓰다","day":"29-30"},{"en":"defect","ko":"결함, 흠","day":"29-30"},{"en":"leisurely","ko":"여유로운, 한가한","day":"29-30"},{"en":"surpass","ko":"능가하다, 넘어서다","day":"29-30"},{"en":"demonstration","ko":"시위, 설명, 시연","day":"29-30"}];

  const KEY_WRONG = "ebsfinal1200:wrong-words";

  const VA = {
    allWords: BASE_WORDS,
    wrongWords: [],
    tab: "quiz",
    quizSize: 20,
    dayFilter: "all",
    session: null,
    searchQuery: "",
  };
  window.VA = VA;

  function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }
  function lsGet(key){
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  }
  function lsSet(key, value){
    try{ localStorage.setItem(key, value); }catch(e){ console.error(e); }
  }

  const DAYS = [];
  BASE_WORDS.forEach(w => { if(DAYS.indexOf(w.day) === -1) DAYS.push(w.day); });

  function init(){
    const stored = lsGet(KEY_WRONG);
    if(stored){
      try{ VA.wrongWords = JSON.parse(stored); }catch(e){ VA.wrongWords = []; }
    }
    render();
  }
  function saveWrong(){ lsSet(KEY_WRONG, JSON.stringify(VA.wrongWords)); }

  VA.switchTab = function(tab){ VA.tab = tab; render(); };
  VA.setQuizSize = function(n){ VA.quizSize = n; render(); };
  VA.setDayFilter = function(v){ VA.dayFilter = v; render(); };

  function pool(){
    if(VA.dayFilter === 'all') return VA.allWords;
    return VA.allWords.filter(w => w.day === VA.dayFilter);
  }

  VA.startQuiz = function(){
    const src = pool();
    const picked = shuffle(src).slice(0, Math.min(VA.quizSize, src.length));
    const questions = picked.map(w => {
      const distractors = shuffle(VA.allWords.filter(x => x.en !== w.en)).slice(0, 3);
      const options = shuffle([w, ...distractors]).map(o => o.en);
      return { word: w, prompt: w.ko, options: options, correctAnswer: w.en };
    });
    VA.session = { questions: questions, idx:0, correctCount:0, answered:false, selected:null };
    render();
  };

  VA.selectAnswer = function(optionText){
    const s = VA.session;
    if(!s || s.answered) return;
    s.answered = true;
    s.selected = optionText;
    const q = s.questions[s.idx];
    if(optionText === q.correctAnswer){
      s.correctCount++;
      const before = VA.wrongWords.length;
      VA.wrongWords = VA.wrongWords.filter(w => w.en !== q.word.en);
      if(VA.wrongWords.length !== before) saveWrong();
    } else {
      if(!VA.wrongWords.some(w => w.en === q.word.en)){
        VA.wrongWords.push({en:q.word.en, ko:q.word.ko, day:q.word.day});
        saveWrong();
      }
    }
    render();
  };

  VA.nextQuestion = function(){
    const s = VA.session;
    if(!s) return;
    if(s.idx < s.questions.length - 1){
      s.idx++; s.answered = false; s.selected = null;
    } else {
      s.idx = s.questions.length;
    }
    render();
  };

  VA.restartQuiz = function(){ VA.session = null; render(); };

  VA.markLearned = function(en){
    VA.wrongWords = VA.wrongWords.filter(w => w.en !== en);
    saveWrong();
    render();
  };

  VA.onSearchInput = function(v){ VA.searchQuery = v; renderSearchResults(); };

  function renderTabs(){
    document.getElementById('tab-quiz').className = 'va-tab' + (VA.tab==='quiz' ? ' active' : '');
    document.getElementById('tab-search').className = 'va-tab' + (VA.tab==='search' ? ' active' : '');
    document.getElementById('tab-wb').className = 'va-tab' + (VA.tab==='wb' ? ' active' : '');
    const badge = document.getElementById('wb-badge');
    if(VA.wrongWords.length > 0){
      badge.style.display = 'inline-block';
      badge.textContent = VA.wrongWords.length;
    } else {
      badge.style.display = 'none';
    }
  }

  function renderQuizTab(){
    const body = document.getElementById('va-body');

    if(!VA.session){
      const n = pool().length;
      const sizes = [10,20,40,n].filter((v,i,a)=>a.indexOf(v)===i && v<=n && v>0);
      body.innerHTML = `
        <div class="va-start">
          <h2>🎯 한글 뜻 → 영어 단어</h2>
          <p>한글 뜻을 보고 알맞은 영어 단어를<br>4개 중에서 골라보세요.</p>
          <div class="va-label">범위 선택</div>
          <select class="va-select" onchange="VA.setDayFilter(this.value)">
            <option value="all"${VA.dayFilter==='all'?' selected':''}>전체 (${VA.allWords.length}단어)</option>
            ${DAYS.map(d => `<option value="${esc(d)}"${VA.dayFilter===d?' selected':''}>Day ${esc(d)}</option>`).join('')}
          </select>
          <div class="va-label">문제 수 (범위 내 ${n}단어)</div>
          <div class="va-count-row">
            ${sizes.map(s => `<div class="va-count-btn ${VA.quizSize===s?'sel':''}" onclick="VA.setQuizSize(${s})">${s===n?'전체 '+s:s+'문제'}</div>`).join('')}
          </div>
          <button class="va-primary-btn" onclick="VA.startQuiz()">🔀 새 시험지 (랜덤)</button>
        </div>
        <div class="va-note">이 기기(브라우저)에 자동 저장돼요</div>
      `;
      return;
    }

    const s = VA.session;

    if(s.idx >= s.questions.length){
      const total = s.questions.length;
      const pct = Math.round((s.correctCount/total)*100);
      body.innerHTML = `
        <div class="va-result">
          <div style="font-size:38px;">${pct>=80?'🎉':pct>=50?'💪':'📚'}</div>
          <h2>시험 완료!</h2>
          <div class="va-score">${s.correctCount} / ${total}</div>
          <div class="va-score-sub">정답률 ${pct}% · 틀린 단어는 자동으로<br>'내 단어장'에 저장됐어요.</div>
          <button class="va-primary-btn" onclick="VA.restartQuiz()">🔀 새 시험지 (랜덤)</button>
        </div>
      `;
      return;
    }

    const q = s.questions[s.idx];
    const pct = Math.round((s.idx/s.questions.length)*100);

    let choicesHtml = '';
    q.options.forEach(opt => {
      let cls = 'va-choice';
      if(s.answered){
        cls += ' disabled';
        if(opt === q.correctAnswer) cls += ' correct';
        else if(opt === s.selected) cls += ' wrong';
      }
      choicesHtml += `<div class="${cls}" onclick="VA.selectAnswer(${JSON.stringify(opt).replace(/"/g,'&quot;')})">${esc(opt)}</div>`;
    });

    let feedbackHtml = '';
    if(s.answered){
      const correct = s.selected === q.correctAnswer;
      feedbackHtml = `<div class="va-feedback ${correct?'ok':'no'}">${correct? '✅ 정답이에요!' : '❌ 오답! 정답: ' + esc(q.correctAnswer)}</div>`;
    }

    body.innerHTML = `
      <div class="va-progress-row">
        <span>문항 ${s.idx+1} / ${s.questions.length}</span>
        <span>맞힌 개수 ${s.correctCount}</span>
      </div>
      <div class="va-progress-bar"><div class="va-progress-fill" style="width:${pct}%"></div></div>
      <div class="va-qcard">
        <div class="va-qtype">한글 뜻 → 영어</div>
        <div class="va-qword">${esc(q.prompt)}</div>
      </div>
      <div class="va-choices">${choicesHtml}</div>
      ${feedbackHtml}
      ${s.answered ? `<div class="va-next-wrap"><button class="va-primary-btn" onclick="VA.nextQuestion()">${s.idx < s.questions.length-1 ? '다음 문제 →' : '결과 보기'}</button></div>` : ''}
    `;
  }

  function renderSearchResults(){
    const list = document.getElementById('va-search-results');
    if(!list) return;
    const q = VA.searchQuery.trim();
    if(q === ''){
      list.innerHTML = `<div class="va-wb-empty">🔎 한글 뜻이나 영어 단어를<br>위 칸에 입력해보세요.</div>`;
      return;
    }
    const lower = q.toLowerCase();
    const matches = VA.allWords.filter(w => w.ko.includes(q) || w.en.toLowerCase().includes(lower));
    if(matches.length === 0){
      list.innerHTML = `<div class="va-wb-empty">😅 "${esc(q)}"에 맞는 단어를<br>찾지 못했어요.</div>`;
      return;
    }
    let html = `<div style="font-size:12.5px;color:var(--sub);font-weight:700;margin-bottom:12px;">${matches.length}개 찾음</div>`;
    matches.slice(0,100).forEach(w => {
      html += `
        <div class="va-wb-item">
          <div>
            <div class="va-wb-en">${esc(w.en)}</div>
            <div class="va-wb-ko">${esc(w.ko)}</div>
            <div class="va-wb-day">Day ${esc(w.day)}</div>
          </div>
        </div>`;
    });
    if(matches.length > 100){
      html += `<div style="text-align:center;font-size:12px;color:var(--sub);margin-top:8px;">결과가 많아 100개까지만 보여드려요.</div>`;
    }
    list.innerHTML = html;
  }

  function renderSearchTab(){
    const body = document.getElementById('va-body');
    body.innerHTML = `
      <div style="margin-top:10px;margin-bottom:14px;">
        <input type="text" id="va-search-input" class="va-search-input"
          placeholder="한글 뜻 또는 영어 단어 입력"
          value="${esc(VA.searchQuery)}" oninput="VA.onSearchInput(this.value)" />
      </div>
      <div id="va-search-results"></div>
    `;
    document.getElementById('va-search-input').focus();
    renderSearchResults();
  }

  function renderWbTab(){
    const body = document.getElementById('va-body');
    if(VA.wrongWords.length === 0){
      body.innerHTML = `<div class="va-wb-empty">📭 아직 저장된 단어가 없어요.<br>시험지를 풀다가 틀리면<br>여기에 자동으로 모여요.</div>`;
      return;
    }
    let html = `<div style="font-size:12.5px;color:var(--sub);font-weight:700;margin-bottom:12px;">총 ${VA.wrongWords.length}개 단어</div>`;
    VA.wrongWords.forEach(w => {
      html += `
        <div class="va-wb-item">
          <div>
            <div class="va-wb-en">${esc(w.en)}</div>
            <div class="va-wb-ko">${esc(w.ko)}</div>
            ${w.day ? `<div class="va-wb-day">Day ${esc(w.day)}</div>` : ''}
          </div>
          <button class="va-wb-btn" onclick="VA.markLearned(${JSON.stringify(w.en).replace(/"/g,'&quot;')})">✓ 외웠어</button>
        </div>`;
    });
    body.innerHTML = html;
  }

  function render(){
    renderTabs();
    if(VA.tab === 'quiz') renderQuizTab();
    else if(VA.tab === 'search') renderSearchTab();
    else renderWbTab();
  }

  init();
})();
</script>
</body>
</html>
